repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.2
    hooks:
      - id: nbstripout
        files: ".ipynb"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        additional_dependencies: ["numpy", "pandas", "scipy"]
